[project]
name = "yolt"
version = "0.1.0"
description = "Paste a YouTube link, get back shareable clips. Parakeet transcribes, Highlightr picks the moments."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "yt-dlp[default]>=2026.7.4",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "openapi-spec-validator>=0.7",
    "pytest>=8.3",
    "python-multipart>=0.0.33",
    "referencing>=0.35",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
